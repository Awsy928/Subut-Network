<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranks | SUBUT</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">

</head>
<body>

<div class="background"></div>

<header class="navbar">
  <div class="logo">SUBUT<span>Network</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a class="active" href="shop.html">Shop</a>
    <a href="support.html">Support</a>
  </nav>
</header>

<main class="container">
  <h1>💎 Ranks Store</h1>
  <div class="rank-grid">

    <div class="rank-card">
      <h2>MVP</h2>
      <ul>
        <li>رتبة شكلها حلو</li>
        <li>كيت جيدة</li>
        <li>/hide</li>
      </ul>
      <p class="price">2$ أو 2M Credits</p>
      <button onclick="buy()">شراء</button>
    </div>

    <div class="rank-card highlight">
      <h2>IMMORTAL</h2>
      <ul>
        <li>كيت ممتازة</li>
        <li>/hide /hat</li>
        <li>/bal</li>
      </ul>
      <p class="price">10$</p>
      <button onclick="buy()">شراء</button>
    </div>

    <div class="rank-card">
      <h2>SUBUT+</h2>
      <ul>
        <li>أفضل رتبة</li>
        <li>كل الكيتات السابقة</li>
        <li>/anvil /workbench</li>
        <li>مميزات مستقبلية</li>
      </ul>
      <p class="price">15$</p>
      <button onclick="buy()">شراء</button>
    </div>

  </div>
</main>

<footer>
© 2026 SUBUT Network
