<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SUBUT Network</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background"></div>

<!-- AUTH MODAL -->
<div id="authModal" class="modal">
  <div class="modal-box">
    <h2 id="authTitle">Register</h2>

    <input type="text" id="username" placeholder="Username">
    <input type="password" id="password" placeholder="Password">

    <button onclick="register()">Register</button>
    <p id="switchAuth">لديك حساب؟ <span onclick="switchToLogin()">Login</span></p>
  </div>
</div>
<header class="navbar hidden">
  <div class="logo">SUBUT Network</div>
  <nav>
    <a href="index.html" class="active">Home</a>
    <a href="shop.html">Shop</a>
  </nav>
</header>

<main class="container hidden" id="content">
  <h1>SUBUT NETWORK</h1>
  <p class="subtitle">عش أفضل تجربة لعب جماعية ومميزة</p>

  <div class="cards">
    <div class="card">
      <h3>Server Status</h3>
      <span class="online">● Online</span>
    </div>

    <div class="card">
      <h3>Online Players</h3>
      <span class="big" id="players">0 / 256</span>
    </div>

    <div class="card">
      <h3>IP</h3>
<span class="big">subutsmp.xyz</span>
    </div>

    <div class="card">
      <h3>Port</h3>
      <span class="big">20243</span>
    </div>
  </div>
</main>

<footer class="hidden">
© 2026 SUBUT Network. All rights reserved.
</footer>

<script src="auth.js"></script>
<script src="script.js"></script>
</body>
</html>
